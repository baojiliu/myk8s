apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj/argo-helm
    path: charts/argo-workflows
    targetRevision: argo-workflows-2.0.4
    helm:
      valueFiles: []
      values: |
        server:
          extraArgs:
            - --auth-mode=server
        workflow:
          serviceAccount:
            create: true
            name: operate-workflow-sa
        singleNamespace: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
