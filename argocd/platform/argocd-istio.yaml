apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-istio
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "21"
spec:
  project: default
  source:
    repoURL: https://github.com/baojiliu/myk8s.git
    targetRevision: HEAD
    path: platform/overlays/local/argocd-istio
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
