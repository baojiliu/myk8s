apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  labels:
    app: hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: hello
          image: CHANGE_ME_REGISTRY/library/hello:latest
          ports:
            - containerPort: 80
              name: http
