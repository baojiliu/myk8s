apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: harbor-gw
  namespace: harbor
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - CHANGE_ME_HOST
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: harbor-vs
  namespace: harbor
spec:
  hosts:
    - CHANGE_ME_HOST
  gateways:
    - harbor-gw
  http:
    - route:
        - destination:
            # clusterIP expose: chart creates nginx front door svc named "harbor" (release name).
            host: harbor
            port:
              number: 80
