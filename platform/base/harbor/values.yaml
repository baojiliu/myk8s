expose:
  type: clusterIP
  tls:
    enabled: false

externalURL: http://CHANGE_ME_HOST

persistence:
  enabled: true
  resourcePolicy: keep
  persistentVolumeClaim:
    registry:
      storageClass: CHANGE_ME_STORAGECLASS
    jobservice:
      jobLog:
        storageClass: CHANGE_ME_STORAGECLASS
    database:
      storageClass: CHANGE_ME_STORAGECLASS
    redis:
      storageClass: CHANGE_ME_STORAGECLASS
    trivy:
      storageClass: CHANGE_ME_STORAGECLASS

# Admin password: injected by scripts/apply-secrets.sh as secret harbor-admin / HARBOR_ADMIN_PASSWORD.
# Do not commit real passwords. Override only if the secret is missing before first sync.
existingSecretAdminPassword: harbor-admin
existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
