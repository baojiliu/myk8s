apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/clickhouse-cluster
patches:
  - target:
      kind: ClickHouseInstallation
      name: ch
    patch: |-
      - op: replace
        path: /spec/templates/volumeClaimTemplates/0/spec/storageClassName
        value: local-path
