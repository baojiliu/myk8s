apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/argocd-istio
patches:
  - target:
      kind: Gateway
      name: argocd-gw
    patch: |-
      - op: replace
        path: /spec/servers/0/hosts/0
        value: argocd.myk8s.local
  - target:
      kind: VirtualService
      name: argocd-vs
    patch: |-
      - op: replace
        path: /spec/hosts/0
        value: argocd.myk8s.local
