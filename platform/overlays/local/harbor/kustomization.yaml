apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/harbor
patches:
  - target:
      kind: Gateway
      name: harbor-gw
    patch: |-
      - op: replace
        path: /spec/servers/0/hosts/0
        value: harbor.myk8s.local
  - target:
      kind: VirtualService
      name: harbor-vs
    patch: |-
      - op: replace
        path: /spec/hosts/0
        value: harbor.myk8s.local
